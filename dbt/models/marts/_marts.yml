version: 2

# Newer dbt nests a generic test's inputs under `arguments:` (see _staging.yml note).
models:
  - name: fct_transactions
    description: >
      Gold fraud fact table: one row per transaction across all four rails, with
      the rail-specific risk_score translated into a risk_band and an is_flagged
      decision. This is the analytics grain for dashboards and investigations.
    columns:
      - name: transaction_id
        description: "Globally unique transaction identifier."
        tests: [unique, not_null]
      - name: rail_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACH', 'WIRE', 'RTP', 'CARD']
      - name: partner_bank_id
        tests: [not_null]
      - name: risk_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: risk_band
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']
      - name: is_flagged
        tests: [not_null]
      - name: is_fraud
        description: "Ground-truth fraud label (validation only, not used in scoring)."
        tests: [not_null]

  - name: agg_fraud_by_rail_day
    description: >
      Daily fraud scorecard at (partner bank x rail x day) grain: volume, fraud
      rate, dollars at risk, and detection quality (recall/precision of the score).
    columns:
      - name: txn_count
        tests: [not_null]
      - name: fraud_rate
        description: "fraud_count / txn_count for the group."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: detection_recall
        description: "true_positives / fraud_count (share of fraud the score caught)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: detection_precision
        description: "true_positives / flagged_count (share of alerts that were real)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    # Grain test: this composite key should be unique -- catches accidental
    # fan-out (duplicate rows) in the aggregation.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [txn_date, partner_bank_id, rail_type]
